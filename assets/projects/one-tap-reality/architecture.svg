<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">OneTapReality product architecture</title><desc id="desc">Photos become a locally edited travel album that can be exported or published through an authenticated API and opened from an NFC gift card.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#e66f42"/></marker><style>.box{fill:#fff8ee;stroke:#e66f42;stroke-width:3}.t{fill:#432f29;font:600 27px system-ui,sans-serif;text-anchor:middle}.s{fill:#795f55;font:20px system-ui,sans-serif;text-anchor:middle}.l{stroke:#e66f42;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1440" height="720" rx="34" fill="#f1e3cf"/>
  <text x="70" y="78" fill="#432f29" font-family="system-ui,sans-serif" font-size="38" font-weight="700">OneTapReality · local-first travel albums and NFC gifts</text>
  <rect class="box" x="70" y="250" width="230" height="140" rx="24"/><text class="t" x="185" y="310">iOS Photos</text><text class="s" x="185" y="348">selected locally</text>
  <rect class="box" x="370" y="250" width="280" height="140" rx="24"/><text class="t" x="510" y="300">Canvas editor</text><text class="s" x="510" y="338">layout · text · stickers</text><text class="s" x="510" y="368">SQLite drafts</text>
  <rect class="box" x="760" y="120" width="260" height="140" rx="24"/><text class="t" x="890" y="180">PDF / image</text><text class="s" x="890" y="218">on-device export</text>
  <rect class="box" x="760" y="430" width="260" height="140" rx="24"/><text class="t" x="890" y="488">Authenticated API</text><text class="s" x="890" y="526">publish shared album</text>
  <rect class="box" x="1110" y="430" width="260" height="140" rx="24"/><text class="t" x="1240" y="488">Postgres + R2</text><text class="s" x="1240" y="526">metadata + media</text>
  <rect class="box" x="1110" y="120" width="260" height="140" rx="24"/><text class="t" x="1240" y="180">NFC gift card</text><text class="s" x="1240" y="218">opens shared album</text>
  <path class="l" d="M300 320H370"/><path class="l" d="M650 300L760 210"/><path class="l" d="M650 350L760 480"/><path class="l" d="M1020 500H1110"/><path class="l" d="M1240 430V270"/>
</svg>
